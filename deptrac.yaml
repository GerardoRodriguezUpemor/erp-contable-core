parameters:
  paths:
    - src
  layers:
    - name: Ingestion
      collectors:
        - type: className
          regex: ^App\\Ingestion\\.*
    - name: Fiscal
      collectors:
        - type: className
          regex: ^App\\Fiscal\\.*
    - name: Shared
      collectors:
        - type: className
          regex: ^App\\Shared\\.*
    - name: Integration
      collectors:
        - type: className
          regex: ^App\\Integration\\.*
  ruleset:
    Ingestion:
      - Shared
    Fiscal:
      - Shared
    Shared: ~
    Integration:
      - Ingestion
      - Fiscal
      - Shared
